name = "rey_zygmund_v3"
version = "0.1.0"
defaultTargets = ["ReyZygmund.MainResults"]

[leanOptions]
autoImplicit = false

# Pinned archive at SOURCE_LOCK.json; not a floating/local development dependency.
# Run python3 -I -B tools/dependencies.py fetch from the repository root for the pinned sources.
[[require]]
name = "mathlib"
path = ".lake/packages/mathlib"

[[lean_lib]]
name = "ReyZygmund"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Challenge1"

[[lean_lib]]
name = "Challenge2"

[[lean_lib]]
name = "Challenge3"

[[lean_lib]]
name = "Challenge4"

[[lean_lib]]
name = "Challenge5"

[[lean_lib]]
name = "Challenge6"

[[lean_lib]]
name = "Verification"
globs = ["Verification.+"]
